
name: Hami Point 商品檢查

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 保存上次商品數量
        uses: actions/cache@v4
        with:
          path: .monitor_state
          key: hami-state-${{ github.run_id }}
          restore-keys: |
            hami-state-

      - name: 安裝瀏覽器
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 測試 iPhone 推播
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS -f \
            -H "Title: Hami Point Test" \
            -d "測試成功！Hami Point 商品通知已連接。" \
            "https://ntfy.sh/${NTFY_TOPIC}"

      - name: 執行商品檢查
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py
